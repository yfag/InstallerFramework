        Appsettings:ConfigDir: \\FILESERVER\PROD\Config
        Appsettings:SchemaDir: \\FILESERVER\PROD\Schema
        Appsettings:Password: CONFIGSERVER_READONLY_PASSWORD
        Appsettings:PasswordEncryptionKey: CONFIGSERVER_PASSWORD_ENCRYPTION_KEY
        Auth:Ui:BasicAuth:Password: CONFIGSERVER_BASIC_AUTH_PASSWORD
        Auth:BasicAuth:Password: CONFIGSERVER_READONLY_PASSWORD
      health-check:
