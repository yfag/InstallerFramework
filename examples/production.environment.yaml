# production.environment.yaml
# Describes the Production environment — which apps go on which servers, at what version,
# and with what environment-specific parameter values.
# This is the file that replaces the old install.json + CSV update approach.
# No passwords. No secrets. Server names and config values only.
# NB! SETTINGS ARE CASE SENSITIVE 

# IMPORTANT!! Names that needs updating in this document (use search and replace in order as below for least hassle ;-) ):

# INSTALLERSERVER = NetBIOS (short name) for the server/share where bundles and environment definitions are stored.
# BACKENDSERVER_FQDN = Fully qualified domain name for the backend server or CNAME alias.
# BACKENDSERVER = NetBios name (short name) for the backend server(s).
# FRONTENDSERVER_FQDN = Fully qualified domain name for the frontend server or CNAME alias.
# FRONTENDSERVER = NetBios name (short name) for the frontend server(s).
# SERVICESERVER_FQDN = Fully qualified domain name for the service server or CNAME alias.
# SERVICESERVER = NetBios name (short name) for the service server(s).
# SEARCHSERVER_FQDN = Fully qualified domain name for the search server or CNAME alias.
# SEARCHSERVER = NetBios name (short name) for the search server(s).
# SCOPES = Scope or scopes that the application should handle (comma separated).
# CONFIGSERVER_READONLY_PASSWORD = Password used by applications to read config from ConfigServer (NB! Used twice in the ConfigServer config)
# CONFIGSERVER_BASIC_AUTH_PASSWORD = Password for BasicAuthentication in the ConfigServer/Editor
# CONFIGSERVER_PASSWORD_ENCRYPTION_KEY = Encryption key for the passwords entered in ConfigServer (NOT the password for Read-only access or BasicAuth)
# DECRYPTION_KEY = machinekey_decryptionKey as generated with ElementsMachineKeyGenerator.exe
# DECRYPTION_METHOD = machinekey_decryption as generated with ElementsMachineKeyGenerator.exe
# VALIDATION_KEY = machinekey_validationKey as generated with ElementsMachineKeyGenerator.exe
# VALIDATION_METHOD = machinekey_validation as generated with ElementsMachineKeyGenerator.exe
# FILESERVER = NetBIOS name (short name) for the server/share where config/documents are stored (NB! check UNC path on each application)
# PROGSERVER_FQDN = NetBIOS (short name) for the server/share where the 3rd Party application lives (e.g. RabbitMQ, PostgreSQL etc.)
# RABBITMQ_USERNAME = RabbitMQ username
# RABBITMQ_PASSWORD = RabbitMQ password
# OUTLOOKPLUGIN_APPREGCLIENTID = Application Registration Clinet Id from EntraID
# INDEXERTRACKER_DB_NAME = Name of the IndexerTracker database
# INDEXERTRACKER_DB_USER = Username for the IndexerTracker database
# INDEXERTRACKER_DB_PASSWORD = Password to det IndexerTracker database user
# NOTIFICATION_DB_NAME = Name of the IndexerTracker database
# NOTIFICATION_DB_USER = Username for the IndexerTracker database
# NOTIFICATION_DB_PASSWORD = Password to det IndexerTracker database user

environment:
  name: Production
  domain-account:
    # If use-gmsa is set to false, installer will ask for account password every time it is run.
    use-gmsa: false
    account: DOMAIN\serviceuser

  # Where to find the .application.yaml files
  # Relative to this file's directory, or absolute path
  manifests-path: \\INSTALLERSERVER\ElementsInstall\ENV\manifests

  # Path to the ChocoPackages folder in the bundle.
  # Structure: {base-path}\bundle\ChocoPackages  — only the base path varies between
  # environments and bundle releases. Update this line when a new bundle is deployed.
  # Examples:
  #   \\deployserver\ElementsInstall\bundle\ChocoPackages   (network share)
  #   C:\ElementsInstall\bundle\ChocoPackages               (local path)
  default-package-source: \\INSTALLERSERVER\[ElementsBundle_path]\ChocoPackages

  # Parameters shared between all applications
  shared-parameters:
    AppSettings:ConfigServer.BaseUrl: https://BACKENDSERVER_FQDN/Elements.ConfigServer
    AppSettings:ConfigServer.Password: CONFIGSERVER_READONLY_PASSWORD
    AppSettings:ConfigServer.Scopes: SCOPES

  # How long to keep installation backups on each server
  backup-retention-days: 14

  # Root directory on target servers where backups are stored
  backup-root: C:\InstallBackups

