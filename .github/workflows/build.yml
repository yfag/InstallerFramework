name: Build

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InstallerFramework.sln

      - name: Build
        run: dotnet build InstallerFramework.sln -c Release --no-restore

      - name: Test
        run: dotnet test InstallerFramework.sln -c Release --no-build --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/InstallerFramework.Cli/InstallerFramework.Cli.csproj
          -c Release -r win-x64 --self-contained --no-restore
          -o publish
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.ref_name }}
          path: publish/installer.exe
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/installer.exe
          generate_release_notes: true
        if: startsWith(github.ref, 'refs/tags/v')
